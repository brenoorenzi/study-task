<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTask - US01</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.97);
        }
        h2 {
            font-size: 18px;
            color: #7f8c8d;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 16px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StudyTask</h1>
        
        <form method="POST" action="/">
            <input type="text" name="nome" placeholder="Nova matéria..." required autocomplete="off">
            <button type="submit">Cadastrar</button>
        </form>

        <h2>Minhas Matérias</h2>
        <ul>
            {% for materia in materias %}
                <li>{{ materia[1] }}</li>
            {% else %}
                <li style="border-left: 4px solid #bdc3c7; color: #7f8c8d;">Nenhuma matéria cadastrada.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
